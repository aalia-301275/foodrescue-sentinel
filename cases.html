	<link rel="stylesheet" href="app.css">

<body data-page="cases">
	<div class="app-shell">
		<aside class="sidebar">
			<a class="brand" href="index.html"><span class="brand-mark">F</span><span class="brand-name">FoodRescue Sentinel<span>DONATION REVIEW DESK</span></span></a>
			<div class="nav-label">Workspace</div>
			<nav class="nav" aria-label="Main navigation">
				<a class="nav-button" href="index.html"><span class="nav-glyph">01</span>Overview</a>
